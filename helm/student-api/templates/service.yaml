apiVersion: v1
kind: Service
metadata:
  name: student-api
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: student-api
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      nodePort: {{ .Values.service.nodePort }}
  type: {{ .Values.service.type }}
