apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: {{ .Values.namespace }}
data:
  FLASK_APP: {{ .Values.flask.app }}
  DEBUG: {{ .Values.flask.debug | quote }}
  POSTGRES_DB: {{ .Values.db.name }}
  POSTGRES_HOST: {{ .Values.db.host }}
  POSTGRES_PORT: {{ .Values.db.port | quote }}
