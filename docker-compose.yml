services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: student_user
      POSTGRES_PASSWORD: student_password
      POSTGRES_DB: student_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student_user -d student_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: student-api:1.0.0
    depends_on:
      db:
        condition: service_healthy
    ports:
      - 5000:5000
    environment:
      DATABASE_URL: postgresql://student_user:student_password@db:5432/student_db
      FLASK_APP: run.py
      DEBUG: "false"

volumes:
  postgres_data: