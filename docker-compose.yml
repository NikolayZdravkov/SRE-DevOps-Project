services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: student_user
      POSTGRES_PASSWORD: student_password
      POSTGRES_DB: student_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student_user -d student_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api1:
    image: student-api:1.0.0
    container_name: api1
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://student_user:student_password@db:5432/student_db
      FLASK_APP: run.py
      DEBUG: "false"

  api2:
    image: student-api:1.0.0
    container_name: api2
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://student_user:student_password@db:5432/student_db
      FLASK_APP: run.py
      DEBUG: "false"

  nginx:
    image: nginx:alpine
    container_name: nginx
    depends_on:
      - api1
      - api2
    ports:
      - 8080:8080
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf

volumes:
  postgres_data: